name: Census data refresh

# Rebuilds the child-density site inputs when the Census publishes new data.
# Runs remotely on GitHub, so it does not depend on Josh's laptop being open.
# Cheap no-op if nothing new.
#
# Two schedules because the page runs on two Census clocks:
#   December/January — new ACS 5-year endyear, which is the map itself.
#   March/April      — new population-estimates vintage, which drives the
#                      national under-18 figure and the components chart. These
#                      vintages REVISE prior years, so skipping them leaves
#                      superseded numbers on the page even though nothing
#                      "new" appears to be missing.
#
# Requires one repo secret: CENSUS_API_KEY
#   Settings -> Secrets and variables -> Actions -> New repository secret

on:
  schedule:
    - cron: '0 13 15 12 *'   # Dec 15, ~08:00 ET — ACS 5-year release
    - cron: '0 13 15 1 *'    # Jan 15, ~08:00 ET — backup if ACS lands late
    - cron: '0 13 20 3 *'    # Mar 20, ~09:00 ET — county/national estimates vintage
    - cron: '0 13 20 4 *'    # Apr 20, ~09:00 ET — backup if the vintage lands late
  workflow_dispatch:          # lets you (or Claude) trigger a test run on demand

permissions:
  contents: write             # to push the rebuilt docs/ back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas geopandas
      - name: Configure git identity
        run: |
          git config user.name "Josh Greenman"
          git config user.email "josh.greenman@gmail.com"
      - name: Run annual refresh
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: bash scripts/annual_refresh.sh
